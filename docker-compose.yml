services:
  mongo:
    image: mongo:7
    container_name: agentia-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - agentia-mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: agentia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - agentia-redis-data:/data

volumes:
  agentia-mongo-data:
  agentia-redis-data:
