<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Agentia</title>
<meta name="description" content="Log in to Agentia to run and revisit your research.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/config.js"></script>
<script src="js/guest-guard.js"></script>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-box">
    <a href="index.html" class="auth-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="26" height="26">
          <circle cx="20" cy="8" r="3.4" class="node-a"/>
          <circle cx="8" cy="30" r="3.4" class="node-b"/>
          <circle cx="32" cy="30" r="3.4" class="node-c"/>
          <path d="M20 8 L8 30 L32 30 Z" fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.5"/>
        </svg>
      </span>
      <span class="brand-word">Agentia</span>
    </a>

    <div class="auth-card">
      <div class="auth-tabs">
        <span class="auth-tab is-active">Log in</span>
        <a href="signup.html" class="auth-tab" style="display:flex;align-items:center;justify-content:center;">Sign up</a>
      </div>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Log in to pick up your research.</p>

      <div class="form-error" id="login-error"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-solid btn-lg btn-full" id="login-btn">Log in &nbsp;→</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/page-login.js"></script>
</body>
</html>
