<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library — Agentia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/config.js"></script>
<script src="js/auth-guard.js"></script>
</head>
<body data-page="library">
<canvas id="agent-scene-ambient" aria-hidden="true"></canvas>
<div id="shell-header"></div>

<main class="app-shell-main">
  <div class="wrap">
    <div class="page-head">
      <p class="page-eyebrow">Library</p>
      <h1 class="page-title">Your reports</h1>
      <p class="page-sub">Everything you've researched, saved automatically. Bookmark the ones worth finding again fast.</p>
    </div>

    <div class="tabs">
      <button class="tab-btn is-active" id="tab-all" type="button">All reports</button>
      <button class="tab-btn" id="tab-saved" type="button">Saved</button>
    </div>

    <div id="library-list">
      <div class="skeleton" style="height:64px;margin-bottom:1px;"></div>
      <div class="skeleton" style="height:64px;margin-bottom:1px;"></div>
      <div class="skeleton" style="height:64px;"></div>
    </div>
  </div>
</main>

<div id="shell-footer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/scene-ambient.js"></script>
<script src="js/page-library.js"></script>
</body>
</html>
