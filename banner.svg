<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="78%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#132030" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0A0E14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#46E0C5"/>
      <stop offset="100%" stop-color="#FFB454"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="#0A0E14"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- faint scattered nodes for depth -->
  <g fill="#1E2A38">
    <circle cx="120" cy="60" r="2"/>
    <circle cx="220" cy="300" r="2.5"/>
    <circle cx="60" cy="220" r="1.8"/>
    <circle cx="1180" cy="70" r="2"/>
    <circle cx="1120" cy="300" r="2.2"/>
    <circle cx="980" cy="50" r="1.6"/>
  </g>

  <!-- brand mark: planner/executor/synthesizer triangle, matches ui.js brand-mark -->
  <g transform="translate(980,90)">
    <path d="M110 0 L0 130 L220 130 Z" fill="none" stroke="url(#lineGrad)" stroke-width="1.4" opacity="0.55"/>
    <circle cx="110" cy="0" r="9" fill="#FFB454"/>
    <circle cx="0" cy="130" r="9" fill="#46E0C5"/>
    <circle cx="220" cy="130" r="9" fill="#8B8FF0"/>
  </g>

  <!-- wordmark -->
  <text x="90" y="165" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#F3F5F8" font-weight="600">Agentia</text>
  <text x="92" y="205" font-family="'Courier New', monospace" font-size="17" letter-spacing="3" fill="#46E0C5">PLANNER · EXECUTOR · SYNTHESIZER</text>

  <text x="92" y="255" font-family="Arial, sans-serif" font-size="20" fill="#9AA5B4">
    Ask a question. Get a sourced report — not twenty tabs.
  </text>

  <!-- tech strip -->
  <text x="92" y="305" font-family="'Courier New', monospace" font-size="13" letter-spacing="1.5" fill="#5A6472">
    FASTAPI · MONGODB · REDIS · GROQ · TAVILY · JWT · THREE.JS
  </text>
</svg>
